# vLLM 0.30.0 서버 설정 — teacher Qwen3.8-27B 공식 FP8 (RunPod A40·RTX A6000 48GB 1장)
# H100 BF16(config.yaml)보다 싸게 띄우는 선택지다. start.sh 에 VLLM_CONFIG 로 이 파일을 넘긴다.
# 골드셋 검증과 대량 라벨링은 같은 설정으로 한다. 골드셋을 FP8 로 쟀으면 합성 라벨링도 FP8 로 한다.

# 공식 FP8 양자화 (e4m3, 활성값 동적 스케일). 라이선스 apache-2.0 (모델 카드), 커밋을 고정해 라벨을 재현한다
model: Qwen/Qwen3.8-27B-FP8
revision: 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
# label_with_teacher.py 의 TEACHER_LLM_MODEL. 라벨 메타데이터에서 BF16 실행과 구분되도록 이름에 정밀도를 붙인다
served-model-name: qwen3.8-27b-fp8

host: "0.0.0.0" # RunPod 프록시가 들어오려면 0.0.0.0
port: 8000

# 메모리 — FP8 가중치 30.9GB. 48GB 에서 남는 약 10GB 를 KV 캐시로 쓴다.
# A40·A6000(Ampere)은 FP8 연산이 없어 vLLM 이 가중치만 FP8 로 두고 BF16 으로 계산한다. H100 보다 느리다.
# 실제 값은 시작 로그의 KV cache / Maximum concurrency 줄로 확인한다
gpu-memory-utilization: 0.92
# 추출 입력(RUBRIC + 온보딩 10턴) + 출력 1500 토큰
max-model-len: 8192
max-num-seqs: 32
# 태깅 요청은 전부 같은 TAG_PROMPT 로 시작하고 같은 답변을 5번 샘플링해서 프리픽스 캐시 효과가 크다
enable-prefix-caching: true
# 이미지 입력을 쓰지 않는다. 비전 인코더용 메모리 프로파일링을 건너뛴다
limit-mm-per-prompt: '{"image": 0, "video": 0}'

# 모델의 generation_config.json 이 샘플링을 바꾸지 않게 (라벨 재현성. 온도는 스크립트가 정한다)
generation-config: vllm

uvicorn-log-level: info
# API 키는 여기 쓰지 않는다. vLLM 이 환경변수 VLLM_API_KEY 를 읽는다 (RunPod Secrets)
# 추론(thinking)은 서버가 아니라 요청마다 끈다: label_with_teacher.py 가 chat_template_kwargs.enable_thinking=false 를 보낸다
