# vLLM 0.30.0 서버 설정 — teacher 라벨링 전용 Qwen3.8-27B (RunPod H100 80GB 1장, 라벨링 동안만 켠다)
# start.sh 가 `vllm serve --config` 로 읽는다. 키 이름은 CLI 플래그에서 -- 를 뺀 것이다.
# 키를 바꾸기 전에 Pod 안에서 `vllm serve --help` 로 0.30.0 에 있는 플래그인지 확인한다.

# 10 증류 teacher 선정기준 4.4절의 teacher. 라이선스 apache-2.0 (모델 카드), 커밋을 고정해 라벨을 재현한다
model: Qwen/Qwen3.8-27B
revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
# label_with_teacher.py 의 TEACHER_LLM_MODEL
served-model-name: qwen3.8-27b

host: "0.0.0.0" # RunPod 프록시가 들어오려면 0.0.0.0
port: 8000

# 메모리 — BF16 가중치 55.6GB. H100 80GB 에서 남는 약 15GB 를 KV 캐시로 쓴다.
# 실제 값은 시작 로그의 KV cache / Maximum concurrency 줄로 확인한다
gpu-memory-utilization: 0.92
# 추출 입력(RUBRIC + 온보딩 10턴) + 출력 1500 토큰. 모델 최대치(262144)로 두면 KV 캐시만 잡아먹는다
max-model-len: 8192
max-num-seqs: 64
# 태깅 요청은 전부 같은 TAG_PROMPT 로 시작하고 같은 답변을 5번 샘플링해서 프리픽스 캐시 효과가 크다
enable-prefix-caching: true
# 이미지 입력을 쓰지 않는다. 비전 인코더용 메모리 프로파일링을 건너뛴다
limit-mm-per-prompt: '{"image": 0, "video": 0}'

# 모델의 generation_config.json 이 샘플링을 바꾸지 않게 (라벨 재현성. 온도는 스크립트가 정한다)
generation-config: vllm

uvicorn-log-level: info
# API 키는 여기 쓰지 않는다. vLLM 이 환경변수 VLLM_API_KEY 를 읽는다 (RunPod Secrets)
# 추론(thinking)은 서버가 아니라 요청마다 끈다: label_with_teacher.py 가 chat_template_kwargs.enable_thinking=false 를 보낸다
