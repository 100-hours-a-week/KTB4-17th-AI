<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하루 온보딩 플레이그라운드</title>
<style>
  :root { --bg:#f6f4f0; --card:#fff; --line:#e4e0d8; --ink:#1f1d1a; --muted:#7a746b; --me:#2f6f5e; --me-ink:#fff; --haru:#efeae2; --accent:#d85a30; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:12px; min-height:100vh; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  h1 { font-size:17px; margin:0 0 8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  label { font-size:13px; color:var(--muted); }
  input[type=text], input[type=password], textarea { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
  .field { flex:1 1 200px; }
  button { padding:9px 14px; border:0; border-radius:8px; background:var(--me); color:var(--me-ink); font:inherit; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { border-radius:0; background:#fff; color:var(--ink); }
  .seg button.on { background:var(--ink); color:#fff; }
  .hint { font-size:12px; color:var(--muted); }
  .chk { display:inline-flex; gap:6px; align-items:center; font-size:13px; }
  #chat { flex:1; display:flex; flex-direction:column; gap:8px; padding:12px 4px; overflow-y:auto; min-height:320px; }
  .msg { max-width:82%; padding:9px 13px; border-radius:14px; white-space:pre-wrap; word-break:keep-all; }
  .haru { align-self:flex-start; background:var(--haru); border-bottom-left-radius:4px; }
  .me { align-self:flex-end; background:var(--me); color:var(--me-ink); border-bottom-right-radius:4px; }
  .sys { align-self:center; font-size:12px; color:var(--muted); background:transparent; }
  .notice { align-self:flex-start; font-size:13px; color:var(--accent); background:#fbeee8; }
  .progress { position:sticky; top:0; align-self:flex-end; font-size:12px; color:var(--muted); background:var(--bg); padding:2px 6px; }
  .choices { display:flex; gap:6px; flex-wrap:wrap; }
  .choices button { background:#fff; color:var(--ink); border:1px solid var(--me); }
  .typing { align-self:flex-start; color:var(--muted); font-size:13px; padding:4px 13px; }
  .controls { align-self:flex-end; display:flex; gap:6px; }
  .controls button { background:transparent; color:var(--muted); border:1px solid var(--line); font-size:12px; padding:5px 10px; }
  .controls button:hover { color:var(--ink); border-color:var(--ink); }
  .headline { font-size:19px; margin:0 0 6px; }
  .body { line-height:1.75; margin:0 0 12px; }
  .traits { margin:0; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:6px; }
  .traits li { padding:8px 12px; background:var(--haru); border-radius:10px; }
  .gauge { display:flex; align-items:center; gap:10px; margin:14px 0 4px; font-size:13px; }
  .gauge .track { flex:1; height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  .gauge .fill { height:100%; background:var(--me); transition:width .6s; }
  .gaps { margin:8px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px; }
  .gaps li { display:flex; align-items:center; gap:8px; font-size:13px; }
  .gaps .lv { color:var(--muted); font-size:12px; min-width:88px; }
  .gaps button { padding:4px 10px; font-size:12px; background:#fff; color:var(--me); border:1px solid var(--me); }
  .changes { margin:10px 0 0; padding:10px 12px; background:#eef5f1; border-radius:10px; font-size:13px; }
  .changes div + div { margin-top:3px; }
  .confirm { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .confirm button.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .ok { color:var(--me); font-size:13px; margin-top:10px; }
  #composer { display:flex; gap:8px; align-items:flex-end; }
  #composer textarea { resize:none; height:44px; }
  .count { font-size:11px; color:var(--muted); min-width:48px; text-align:right; }
  details summary { cursor:pointer; font-size:13px; color:var(--muted); }
  pre { font-size:12px; overflow:auto; background:#faf8f4; padding:10px; border-radius:8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>하루 온보딩 플레이그라운드 <span class="hint">features/persona 그대로 · dev/persona 에서 DB·LLM만 갈아끼움</span></h1>
    <div class="row">
      <div class="field">
        <label>API 키 — Gemini (<code>AIza…</code>) 또는 Anthropic (<code>sk-ant-…</code>)</label>
        <input type="password" id="apikey" placeholder="AIza… / sk-ant-…" autocomplete="off">
        <div class="hint" id="keyhint"></div>
      </div>
      <div class="field" style="flex:0 1 160px">
        <label>닉네임</label>
        <input type="text" id="nickname" value="은서" maxlength="20">
      </div>
    </div>
    <div class="row">
      <label>프로바이더</label>
      <div class="seg" id="provider">
        <button data-provider="gemini" class="on">Gemini</button>
        <button data-provider="anthropic">Anthropic</button>
      </div>
      <span class="hint" id="providerhint"></span>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="tagging"> 턴별 태깅 호출 (켜면 턴당 LLM 2회)</label>
      <span style="flex:1"></span>
      <button id="start">시작</button>
    </div>
    <div class="hint">키는 브라우저 세션에만 두고 요청마다 <code>X-Api-Key</code> 헤더로 보냅니다. 서버는 저장하지 않습니다.</div>
  </div>

  <div id="chat"></div>

  <div class="card" id="composer" hidden>
    <textarea id="input" maxlength="200" placeholder="답변을 입력하세요 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
    <span class="count" id="count">0/200</span>
    <button id="send">보내기</button>
  </div>

  <div class="card" id="result" hidden></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const chat = $('#chat');
let meta = null, provider = 'gemini', pendingResolve = null, currentSession = null;

// ── 설정 ──
try { $('#apikey').value = sessionStorage.getItem('apikey') || ''; provider = sessionStorage.getItem('provider') || 'gemini'; } catch (_) {}
function seg(id, key, cb) {
  $(id).addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) cb(b.dataset[key]); });
}
function setProvider(p) {
  provider = p;
  [...$('#provider').children].forEach(x => x.classList.toggle('on', x.dataset.provider === p));
  $('#providerhint').textContent = meta ? `모델 ${meta.models[p]}` : '';
  try { sessionStorage.setItem('provider', p); } catch (_) {}
}
seg('#provider', 'provider', setProvider);
const providerOf = (k) => k.startsWith('AIza') ? 'gemini' : k.startsWith('sk-ant-') ? 'anthropic' : null;
function keyHint() {
  const k = $('#apikey').value.trim(); const p = providerOf(k);
  if (p) setProvider(p);
  $('#keyhint').textContent = !k ? '' : p ? `${p === 'gemini' ? 'Gemini' : 'Anthropic'} 키로 인식` : '접두어로 판별 못 함 — 프로바이더 토글대로 보냅니다';
}
$('#apikey').addEventListener('input', keyHint);

// ── API ──
function headers() {
  const key = $('#apikey').value.trim();
  try { sessionStorage.setItem('apikey', key); } catch (_) {}
  const h = { 'Content-Type': 'application/json', 'X-Provider': provider, 'X-Tagging': $('#tagging').checked ? '1' : '0' };
  if (key) h['X-Api-Key'] = key;
  return h;
}
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: headers(), body: body ? JSON.stringify(body) : undefined });
  const text = await r.text();
  let data; try { data = JSON.parse(text); } catch (_) { data = { detail: text }; }
  if (!r.ok) throw new Error(`${r.status} ${typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail)}`);
  return data;
}
api('GET', '/meta').then(m => { meta = m; setProvider(provider); keyHint(); }).catch(() => {});

// ── 채팅 UI ──
const nick = () => $('#nickname').value.trim() || '사용자';
const norm = (s) => s.replace(/\s/g, '');
function bubble(cls, text) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d; }
const haru = (t) => bubble('haru', t), me = (t) => bubble('me', t), sys = (t) => bubble('sys', t), notice = (t) => bubble('notice', t);
function choices(list, onPick) {
  const d = document.createElement('div'); d.className = 'msg choices';
  list.forEach(c => { const b = document.createElement('button'); b.textContent = c; b.onclick = () => { d.remove(); onPick(c); }; d.appendChild(b); });
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
// 답변 대기. 결과는 문자열(답변) 또는 { control: 'skip' | 'finish' }
function waitForAnswer(turn) {
  return new Promise((resolve) => {
    pendingResolve = resolve; $('#composer').hidden = false; $('#input').focus();
    if (turn.choices) choices(turn.choices, (c) => submit(c));
    if (turn.can_skip || turn.can_finish) {
      const d = document.createElement('div'); d.className = 'msg controls';
      const mk = (label, control) => { const b = document.createElement('button'); b.textContent = label; b.onclick = () => resolveWith({ control }); d.appendChild(b); };
      if (turn.can_skip) mk('이 질문은 건너뛸게요', 'skip');
      if (turn.can_finish) mk('여기까지만 할게요', 'finish');
      chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
    }
  });
}
function resolveWith(value) {
  if (!pendingResolve) return;
  document.querySelectorAll('.choices, .controls').forEach(x => x.remove());
  $('#input').value = ''; $('#count').textContent = '0/200';
  const r = pendingResolve; pendingResolve = null; r(value);
}
function submit(text) {
  text = (text ?? $('#input').value).trim();
  if (!text || !pendingResolve) return;
  me(text); resolveWith(text);
}
$('#send').onclick = () => submit();
$('#input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
$('#input').addEventListener('input', (e) => { $('#count').textContent = `${e.target.value.length}/200`; });

// ── 흐름: features/persona/api.py 의 엔드포인트 그대로 (start · answer · skip · finish · build) ──
$('#start').onclick = async () => {
  if (!$('#apikey').value.trim()) { alert('API 키를 입력하세요.'); return; }
  $('#start').disabled = true; chat.innerHTML = ''; $('#result').hidden = true;
  try {
    meta = meta || await api('GET', '/meta');
    const chk = await api('POST', '/check');
    if (!chk.ok) { notice(`키 확인 실패 (${provider}): ${chk.error}`); return; }
    sys(`${chk.provider} · ${chk.model} 연결 확인 · 태깅 ${$('#tagging').checked ? 'on' : 'off'}`);
    haru(`안녕하세요, 저는 하루예요. AI지만 오늘은 소개팅 상대 역할을 해볼게요.`);
    haru(`편하게 답해주시면 그 대화로 ${nick()}님의 AI 페르소나가 만들어져요. 10번 정도 주고받으면 끝나요.`);

    let turn = await api('POST', '/v1/persona/onboarding/start', { nickname: nick(), total_turns: 10 });
    while (!turn.done) {
      bubble('progress', turn.progress);
      haru(turn.utterance);
      let ans;
      while (true) {
        ans = await waitForAnswer(turn);
        if (typeof ans !== 'string' || norm(ans).length >= 2) break;
        notice('두 글자 이상 적어주세요.');
      }
      const t = bubble('typing', '···');
      try {
        if (ans.control === 'skip') { sys('이 질문은 건너뛰었어요'); turn = await api('POST', `/v1/persona/onboarding/${turn.session_id}/skip`); }
        else if (ans.control === 'finish') { sys(`여기까지 · ${turn.answered}개 답변으로 만들어요`); turn = await api('POST', `/v1/persona/onboarding/${turn.session_id}/finish`); }
        else turn = await api('POST', `/v1/persona/onboarding/${turn.session_id}/answer`, { answer: ans });
      } finally { t.remove(); }
    }
    haru(turn.utterance);
    const slow = setTimeout(() => haru('조금만 더요. 꼼꼼히 보고 있어요.'), 6000);
    try {
      const persona = await api('POST', `/v1/persona/${turn.session_id}/build`);
      haru(`다 됐어요. ${nick()}님이 연애에서 어떤 사람인지, 제가 이해한 대로 보여드릴게요.`);
      currentSession = turn.session_id;
      renderPersona(persona);
    } catch (e) {
      notice('잠깐 문제가 있었어요. 답변은 그대로 있으니 다시 만들어볼게요.  (' + e.message + ')');
    } finally { clearTimeout(slow); }
  } catch (e) {
    notice('오류: ' + e.message);
  } finally { $('#composer').hidden = true; $('#start').disabled = false; }
};

// ── 결과 화면 — 설명형. "○○님은 이런 특징이 있어요" + 정확도 + 보강 + 확인 ──
const eunNeun = (w) => { const c = w.charCodeAt(w.length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 ? '은' : '는'; };
const esc = (t) => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const AREA = { intimacy: '친밀감 · 거리감', communication: '소통 · 표현', conflict: '갈등 대응', ideal: '상대 선호', orientation: '관계 지향' };

function renderPersona(p, opts = {}) {
  const n = p.narrative;
  let html = `<div class="hint" style="margin-bottom:6px">${esc(nick())}님은 이런 특징이 있어요 <span style="float:right">v${p.version}</span></div>`;
  if (n) {
    html += `<h1 class="headline">${esc(n.headline)}</h1><p class="body">${esc(n.body)}</p>`;
    if (n.traits?.length) html += '<ul class="traits">' + n.traits.map(t => `<li>${esc(t)}</li>`).join('') + '</ul>';
  } else html += '<p class="body">이번엔 설명을 만들지 못했어요. 다시 만들어볼게요.</p>';

  const talk = [];
  if (p.interests?.length) talk.push(`요즘 관심사는 ${p.interests.join(', ')}`);
  if (p.routine?.length) talk.push(`주말엔 ${p.routine.join(', ')}`);
  if (p.date_prefer?.length) talk.push(`${p.date_prefer.join(', ')} 같은 데이트를 좋아하고`);
  if (p.date_avoid?.length) { const w = p.date_avoid.join(', '); talk.push(`${w}${eunNeun(w)} 피하는 편`); }
  if (talk.length) html += `<p class="body" style="margin-top:12px">${esc(talk.join(' · '))}</p>`;

  // 변화 — 재빌드 뒤에만
  if (p.changes?.length) {
    html += '<div class="changes"><b>방금 알려주신 걸로 이렇게 바뀌었어요</b>' +
      p.changes.map(c => `<div>${esc(c.label)} · ${c.kind === 'score' ? '' : ''}${esc(c.before)} → <b>${esc(c.after)}</b></div>`).join('') + '</div>';
  }

  // 정확도 게이지
  html += `<div class="gauge"><span>페르소나 정확도 <b>${p.accuracy}%</b></span><div class="track"><div class="fill" style="width:${p.accuracy}%"></div></div><span class="hint">알려줄수록 올라가요</span></div>`;

  // 아직 잘 모르는 부분 — LOW 먼저, 3개만. 영역 필터가 있으면 그 영역만
  let gaps = (p.gaps || []).filter(g => g.question);
  if (opts.area) gaps = gaps.filter(g => g.area === opts.area);
  if (gaps.length) {
    html += `<div class="hint" style="margin-top:10px">${opts.area ? AREA[opts.area] + ' 쪽에서 ' : ''}아직 잘 모르는 부분이에요. 하나만 더 알려주시면 정확해져요.</div><ul class="gaps">` +
      gaps.slice(0, 3).map(g => `<li><span class="lv">${esc(g.confidence_label)}</span><span style="flex:1">${esc(g.label)}</span><button data-dim="${g.dimension}" data-q="${esc(g.question)}">알려주기</button></li>`).join('') + '</ul>';
  }

  // 확인 루프
  if (p.confirmed) html += '<div class="ok">✓ 이대로 좋다고 확인하셨어요. 대화할수록 계속 다듬어질게요.</div>';
  else html += `<div class="confirm"><button id="agree">이대로 좋아요</button><button class="secondary" id="disagree">조금 다른 것 같아요</button></div><div id="areas" hidden style="margin-top:8px"></div>`;

  html += '<div class="hint" style="margin-top:10px">답변을 바탕으로 AI가 정리한 내용이에요. 심리검사 결과가 아니에요.</div>';
  html += `<details style="margin-top:8px"><summary>원본 데이터 (개발용)</summary><pre>${esc(JSON.stringify(p, null, 2))}</pre></details>`;
  $('#result').innerHTML = html; $('#result').hidden = false;
  if (!opts.keepScroll) $('#result').scrollIntoView({ behavior: 'smooth' });

  $('#result').querySelectorAll('.gaps button').forEach(b => b.onclick = () => supplementFlow(b.dataset.dim, b.dataset.q));
  $('#agree')?.addEventListener('click', () => feedback(true, null));
  $('#disagree')?.addEventListener('click', () => {
    const box = $('#areas'); box.hidden = false;
    box.innerHTML = '<span class="hint">어느 쪽이 다른 것 같아요?</span> ' + Object.entries(AREA).map(([k, v]) => `<button class="secondary" data-area="${k}" style="margin:4px 4px 0 0;font-size:12px;padding:5px 10px">${v}</button>`).join('');
    box.querySelectorAll('button').forEach(b => b.onclick = () => feedback(false, b.dataset.area));
  });
}

// 보강 문답: 하루가 그 차원의 질문을 채팅으로 묻고 → 답 → 재빌드 → 변화 표시
async function supplementFlow(dimension, question) {
  $('#start').disabled = true;
  try {
    haru(question);
    let ans;
    while (true) { ans = await waitForAnswer({}); if (typeof ans === 'string' && norm(ans).length >= 2) break; notice('두 글자 이상 적어주세요.'); }
    const t = bubble('typing', '···');
    try {
      const p = await api('POST', `/v1/persona/${currentSession}/supplement`, { dimension, answer: ans });
      haru('고마워요. 방금 얘기 반영해서 다시 정리했어요.');
      renderPersona(p);
    } finally { t.remove(); }
  } catch (e) { notice('반영 실패: ' + e.message); }
  finally { $('#composer').hidden = true; $('#start').disabled = false; }
}

async function feedback(agree, area) {
  try {
    const p = await api('POST', `/v1/persona/${currentSession}/feedback`, { agree, area });
    if (agree) haru('좋아요, 기억해 둘게요.');
    else haru(`${AREA[area]} 쪽이 좀 다르군요. 그럼 그쪽을 조금 더 물어볼게요.`);
    renderPersona(p, { area: agree ? null : area, keepScroll: true });
  } catch (e) { notice('오류: ' + e.message); }
}
</script>
</body>
</html>
