[project]
name = "ktb-git"
version = "0.1.0"
description = "KTB Git convention CLI"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "questionary",
]

[project.scripts]
ktb = "ktb_git.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ktb_git"]

[tool.ruff]
line-length = 120
exclude = ["docs", ".venv"]
